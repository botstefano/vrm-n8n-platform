name: CI

on:
  push:
    branches: [master, feature/supabase-integration]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript and Vite production build
        run: npm run build
      - name: Check Express API JavaScript syntax
        run: node --check server.js
      - name: Validate n8n workflow JSON
        run: node -e "const fs=require('fs'); for (const f of fs.readdirSync('automation/n8n/workflows').filter(x=>x.endsWith('.json'))) JSON.parse(fs.readFileSync('automation/n8n/workflows/'+f,'utf8')); console.log('All n8n workflow JSON files are valid.');"
