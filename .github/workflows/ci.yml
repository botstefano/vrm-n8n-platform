name: CI

on:
  push:
    branches: [master, feature/supabase-integration]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript and Vite production build
        run: npm run build
      - name: Check Express API JavaScript syntax
        run: node --check server.js
      - name: Validate n8n workflows and Code node JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'automation/n8n/workflows';
          let workflowCount = 0;
          let codeNodeCount = 0;
          for (const file of fs.readdirSync(path).filter((name) => name.endsWith('.json'))) {
            const workflow = JSON.parse(fs.readFileSync(`${path}/${file}`, 'utf8'));
            workflowCount += 1;
            for (const node of workflow.nodes || []) {
              if (node.type !== 'n8n-nodes-base.code') continue;
              try {
                new Function(node.parameters?.jsCode || '');
                codeNodeCount += 1;
              } catch (error) {
                throw new Error(`${file} / ${node.name}: ${error.message}`);
              }
            }
          }
          console.log(`Validated ${workflowCount} workflow JSON files and ${codeNodeCount} Code node scripts.`);
          NODE
